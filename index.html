<!DOCTYPE html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daniel Aerial Photography</title>
    <meta
      name="description"
      content="Aerial photography by Daniel — landscapes, cities, and seasons from above."
    />
    <meta name="theme-color" content="#0b0b0c" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("dap-theme");
          if (t) {
            document.documentElement.setAttribute("data-theme", t);
            document.documentElement.style.colorScheme = t === "paper" ? "light" : "dark";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500&display=swap"
    />
    <link rel="stylesheet" href="assets/site.css" />
  </head>
  <body>
    <section id="intro" class="intro" aria-hidden="false">
      <div class="intro-fallback" aria-hidden="true"></div>
      <img class="intro-photo" src="hero.jpg" alt="" />
      <div class="intro-veil" aria-hidden="true"></div>
      <button id="skip" class="sr-only" type="button">Skip to work</button>
      <div class="intro-copy">
        <p class="kicker">From above</p>
        <h1 class="hero-title" data-site-name>Daniel Aerial Photography</h1>
      </div>
      <div class="scroll-wrap">
        <button id="scroll-enter" class="scroll-btn" type="button" aria-label="Scroll to enter the gallery">
          Scroll to enter
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
      </div>
    </section>

    <main id="work-view" class="work hidden">
      <header class="work-header">
        <button id="brand-home" class="brand" type="button" data-site-name>Daniel Aerial Photography</button>
        <p class="work-label">Work</p>
      </header>
      <div id="grid" class="grid"></div>
      <footer class="footer" data-site-name>Daniel Aerial Photography</footer>
    </main>

    <main id="category" class="category hidden">
      <header class="cat-header">
        <a class="back" href="#work">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25">
            <path d="m15 18-6-6 6-6" />
          </svg>
          Work
        </a>
        <a class="brand" href="#work" data-site-name>Daniel Aerial Photography</a>
      </header>
      <section class="cat-body">
        <p class="kicker">Collection</p>
        <h1 id="cat-title"></h1>
        <p id="cat-blurb" class="blurb"></p>
        <div id="cat-photos"></div>
      </section>
    </main>

    <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
      <button class="close" type="button" aria-label="Close photograph">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
      <button class="prev" type="button" aria-label="Previous photograph">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>
      <figure>
        <img alt="" />
        <figcaption>
          <p class="photo-title"></p>
          <p class="photo-copy"></p>
        </figcaption>
      </figure>
      <button class="next" type="button" aria-label="Next photograph">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </div>

    <div id="theme-picker" class="theme-picker" role="group" aria-label="Color theme">
      <span class="theme-label">Tone</span>
    </div>

    <script src="assets/site.js"></script>
  </body>
</html>
